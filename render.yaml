# Render Blueprint: Render dashboard -> New -> Blueprint -> pick this repo.
# Provisions the API, a Postgres database and a Redis-compatible Key Value store.
# NOTE: resource names below are identifiers, not branding. Renaming one makes Render
# create a brand-new resource (and for the database, an empty one), so leave them as-is.
services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Migrations run at startup under a Postgres advisory lock (app/migrate.py),
    # so scaling this up is safe; the free plan allows one instance anyway.
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: url-shortener-cache
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Client IP behind proxies (app/proxy.py). Render's chain is
      # [..., client, cloudflare, render-balancer], so the client is 3rd from the right.
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      # Same value as the Vercel project's PROXY_SECRET env var; set in the dashboard.
      - key: PROXY_SECRET
        sync: false
      # BASE_URL is picked up automatically from Render's RENDER_EXTERNAL_URL.

  - type: keyvalue
    name: url-shortener-cache
    plan: free
    ipAllowList: [] # internal traffic only

databases:
  - name: url-shortener-db
    plan: free
